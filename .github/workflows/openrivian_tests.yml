name: OpenRivian Tests & CI/CD
on:
  push:
    branches:
      - '**'

# Concurrency is declared PER JOB, not workflow-wide. A single workflow-wide
# "build-dev" group made near-simultaneous pushes to DIFFERENT feature branches
# cancel each other's runs entirely (observed 2026-07-17: api and web-dashboard
# feature tests showed "cancelled" whenever mqtt pushed last). Feature tests are
# per-branch and independent; only the dev-test rebuild is a shared resource.

jobs:
  test_feature:
    name: Test Feature Branch
    runs-on: ubuntu-latest
    # Per-branch group: a newer push to the SAME branch supersedes the old run,
    # but pushes to other branches never cancel this one.
    concurrency:
      group: test-feature-${{ github.ref }}
      cancel-in-progress: true
    if: github.ref != 'refs/heads/dev-test' && github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/clean'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run OpenRivian Daemon Tests
        run: |
          PYTHONPATH=. uv run coverage run --source=selfdrive/openrivian -m pytest selfdrive/openrivian/tests \
            --ignore=selfdrive/openrivian/tests/test_dependencies.py \
            --confcutdir=selfdrive/openrivian/tests -o addopts="" -p no:cacheprovider -v
      - name: Coverage report (informational)
        run: PYTHONPATH=. uv run coverage report -m || true

  build_dev_test:
    name: Rebuild dev-test & Integration Tests
    runs-on: ubuntu-latest
    needs: test_feature
    permissions:
      contents: write
    # Shared group: dev-test is a single shared branch, so rebuilds are serialized
    # across ALL feature branches and a newer push cancels an in-flight rebuild
    # (and any stale pending promote approval in the same group).
    concurrency:
      group: build-dev
      cancel-in-progress: true
    # Rebuild + test on every feature-branch push (excludes deploy/base branches and can-debug).
    if: success() && github.ref != 'refs/heads/can-decode' && github.ref != 'refs/heads/can-debug' && github.ref != 'refs/heads/dev-test' && github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/clean' && github.event_name == 'push'
    steps:
      - name: Checkout Clean
        uses: actions/checkout@v4
        with:
          ref: clean
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Rebuild dev-test locally
        run: |
          git checkout -B dev-test
          git fetch origin

          # List of active feature branches to merge into dev-test
          # EXPLICITLY EXCLUDES can-decode/can-debug to keep it standalone
          FEATURE_BRANCHES=("api" "web-dashboard" "mqtt")

          # Feature-branch independence: a branch that fails to merge is aborted and
          # SKIPPED so the others still integrate. dev-test is built from whatever merges
          # cleanly; we only fail the build if nothing merged at all.
          MERGED=()
          SKIPPED=()
          for branch in "${FEATURE_BRANCHES[@]}"; do
            echo "Merging origin/$branch into dev-test..."
            if git merge "origin/$branch" --no-edit; then
              MERGED+=("$branch")
            else
              echo "::warning::Merge conflict with '$branch'; aborting that merge and continuing so the other feature branches still integrate."
              git merge --abort
              SKIPPED+=("$branch")
            fi
          done
          echo "Merged cleanly:  ${MERGED[*]:-none}"
          echo "Skipped (conflict): ${SKIPPED[*]:-none}"
          if [ "${#SKIPPED[@]}" -ne 0 ]; then
            echo "::warning::dev-test was built WITHOUT: ${SKIPPED[*]}. Resolve the conflict on those branches to re-include them."
          fi
          if [ "${#MERGED[@]}" -eq 0 ]; then
            echo "::error::No feature branches merged cleanly into dev-test; failing the build."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Dependency Validation
        run: |
          PYTHONPATH=. uv run python3 selfdrive/openrivian/tests/test_dependencies.py

      - name: Run Extensive Integration Tests on dev-test
        run: |
          PYTHONPATH=. uv run coverage run --source=selfdrive/openrivian -m pytest selfdrive/openrivian/tests \
            --ignore=selfdrive/openrivian/tests/test_dependencies.py \
            --confcutdir=selfdrive/openrivian/tests -o addopts="" -p no:cacheprovider -v
      - name: Coverage report (informational)
        run: PYTHONPATH=. uv run coverage report -m || true

      - name: Push dev-test (integration branch, NOT deployed)
        run: |
          echo "Integration tests passed. Publishing dev-test (not yet deployed to dev)."
          git push origin dev-test --force

  promote_dev:
    name: Promote dev-test -> dev (manual approval)
    runs-on: ubuntu-latest
    needs: build_dev_test
    permissions:
      contents: write
    # Manual approval + email: the 'dev' environment has a required reviewer, so this
    # job pauses and notifies before anything reaches the dev branch the vehicle runs.
    environment: dev
    concurrency:
      group: build-dev
      cancel-in-progress: true
    if: success() && github.ref != 'refs/heads/can-decode' && github.ref != 'refs/heads/can-debug' && github.ref != 'refs/heads/dev-test' && github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/clean' && github.event_name == 'push'
    steps:
      - name: Checkout dev-test
        uses: actions/checkout@v4
        with:
          ref: dev-test
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Strip simulator + test + rebuild dashboard (production has no simulator)
        working-directory: selfdrive/openrivian/dashboard
        run: |
          bash scripts/strip_sim.sh
          npm ci
          # Gate the promoted UI: run the dashboard unit tests against the exact
          # (stripped) tree that ships. Previously JS tests only ran on
          # web-dashboard pushes, so dev itself was never test-gated.
          npm test
          npm run build

      - name: Promote stripped build to dev
        run: |
          # Commit the simulator removal + rebuilt bundle on top of dev-test, then push
          # to dev. dev-test keeps the simulator (for testing); dev never has it.
          # Stage only src + the app bundle/index (never the LFS-managed dist svgs).
          git add -A selfdrive/openrivian/dashboard/src selfdrive/openrivian/dashboard/scripts
          git add selfdrive/openrivian/dashboard/dist/assets selfdrive/openrivian/dashboard/dist/index.html
          git commit -m "[promote] strip simulator for production dev" || echo "nothing to strip"

          # Tag every promoted build BEFORE the force-push. dev's history is
          # rewritten on each promotion, so without a tag the SHA a drive log
          # records (initData.gitCommit) becomes unreachable -- which made the
          # 2026-07 incident forensics harder than they needed to be.
          TAG="promoted-$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short HEAD)"
          git tag "$TAG"
          git push --no-verify origin "$TAG"

          echo "Approved. Promoting to dev (Release Candidate) as $TAG."
          git push origin HEAD:dev --force
