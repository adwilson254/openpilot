name: Nightly Upstream Sync & Inject

# Fast-forward `clean` onto AdventurePilot `stg-src`, the source branch the
# installable `stg` prebuilt is built from. `stg` itself is a force-pushed
# orphan prebuilt (no history, no SConstruct, empty `prebuilt` marker). Feature
# CI checks `clean` out and can promote the result onto `dev` (the branch in
# the car), so `clean` tracks `stg-src`, not that prebuilt.
#
# Schedule fires only from the default branch (`dev`). This file has to live here.

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync_and_inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout clean
        uses: actions/checkout@v4
        with:
          ref: clean
          fetch-depth: 0
          persist-credentials: true
          # Do not pass secrets.SYNC_PAT into checkout. That PAT is the git
          # credential for this step; once it expired, every scheduled run died
          # here with "could not read Username for 'https://github.com'" and
          # never fetched upstream. The default GITHUB_TOKEN can read this repo
          # and can push `clean` as long as the push does not modify workflow files.

      - name: Setup Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch AdventurePilot stg-src
        run: |
          git remote add upstream https://github.com/adventurepilotdev/adventurepilot.git
          git fetch --no-tags upstream stg-src

      - name: Sync clean to stg-src
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git checkout clean
          upstream=$(git rev-parse upstream/stg-src)
          short=$(git rev-parse --short "$upstream")

          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo "clean already contains AdventurePilot stg-src $short"
            echo "synced=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Prefer a pure fast-forward so `clean` stays identical to stg-src.
          # GITHUB_TOKEN refuses a push that changes .github/workflows (there is
          # no workflows permission on that token). When that happens, merge
          # instead and keep the workflow files already on clean. The result
          # still has stg-src as a parent, so the next run sees it as synced
          # until stg-src moves again.
          synced=false
          if git merge --ff-only "$upstream"; then
            if git push --no-verify origin clean; then
              synced=true
              echo "clean fast-forwarded to stg-src $short"
            else
              echo "::warning::fast-forward push was rejected (workflow files changed). Merging and keeping this fork's workflow files."
              git reset --hard origin/clean
            fi
          else
            echo "::warning::clean cannot fast-forward to stg-src $short. Merging and keeping this fork's workflow files."
            git merge --abort || git reset --hard origin/clean
          fi

          if [ "$synced" = "false" ]; then
            ours=$(git rev-parse HEAD)
            git merge --no-ff --no-commit "$upstream" || true
            # Exactly the workflow tree from clean, not AdventurePilot's CI.
            git rm -rf --quiet --ignore-unmatch .github/workflows
            git checkout "$ours" -- .github/workflows
            git add -A .github/workflows
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::clean could not take stg-src $short. Conflicted paths:"
              git diff --name-only --diff-filter=U
              git merge --abort || git reset --hard origin/clean
              exit 1
            fi
            git commit --no-edit -m "nightly: sync AdventurePilot stg-src ($short)"
            git push --no-verify origin clean
            echo "clean merged stg-src $short (workflow files unchanged)"
          fi
          echo "synced=true" >> "$GITHUB_OUTPUT"

      # Push of clean already happened above, before dev-test is touched, so a
      # dev-test conflict cannot discard a good clean sync.
      - name: Inject into dev-test branch
        if: steps.sync.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git checkout dev-test || git checkout -b dev-test
          if git merge --no-edit clean; then
            python3 selfdrive/ui/openrivian/scripts/inject.py
            git add system/ui/spinner.py
            git diff --staged --quiet || git commit -m "[bot] Inject OpenRivian hooks"
            git push --no-verify origin dev-test
          else
            git merge --abort
            echo "::warning::clean -> dev-test merge has conflicts; clean is already updated. Not pushing dev-test."
            BRANCH="sync/dev-test-$(date +%Y%m%d)"
            git branch -f "$BRANCH" clean
            # This push is the clean tip. If it only updates a new branch and
            # that tip changes workflow files relative to the base, GITHUB_TOKEN
            # may reject it. A rejected PR push must not fail the clean sync.
            git push --no-verify -f origin "$BRANCH" \
              && gh pr create --base dev-test --head "$BRANCH" \
                --title "Sync clean -> dev-test ($(date +%Y-%m-%d))" \
                --body "Automated clean -> dev-test merge hit conflicts. \`clean\` is already at AdventurePilot stg-src. Resolve and merge; OpenRivian injection was skipped this run." \
              || echo "Could not open a dev-test sync PR (workflow-file push or an existing PR). clean itself was updated."
          fi
